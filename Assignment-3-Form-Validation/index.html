<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3 - Form Validation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>User Registration</h2>
    <form id="registrationForm" novalidate>
      
      <!-- Name Field -->
      <div class="form-control">
        <label for="username">Full Name</label>
        <input type="text" id="username" placeholder="John Doe">
        <small class="error-msg"></small>
      </div>

      <!-- Email Field -->
      <div class="form-control">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com">
        <small class="error-msg"></small>
      </div>

      <!-- Phone Field -->
      <div class="form-control">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="10-digit phone number">
        <small class="error-msg"></small>
      </div>

      <!-- Password Field -->
      <div class="form-control">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 8 chars (1 letter & 1 number)">
        <small class="error-msg"></small>
      </div>

      <button type="submit">Register</button>
      <div id="success-message" class="success-msg"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
