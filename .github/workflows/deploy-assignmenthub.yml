name: Deploy AssignmentHub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Assignment 6/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: Assignment 6
      - name: Build website
        run: npm run build
        working-directory: Assignment 6
      - name: Install profile-card dependencies
        run: npm ci
        working-directory: Assignment 4
      - name: Build profile-card assignment
        run: npm run build
        working-directory: Assignment 4
      - name: Install controlled-form dependencies
        run: npm ci
        working-directory: Assignment 5
      - name: Build controlled-form assignment
        run: npm run build
        working-directory: Assignment 5
      - name: Assemble independent assignment pages
        run: |
          mkdir -p "Assignment 6/dist/Assignment 4" "Assignment 6/dist/Assignment 5"
          cp -R "Assignment 4/dist/." "Assignment 6/dist/Assignment 4/"
          cp -R "Assignment 5/dist/." "Assignment 6/dist/Assignment 5/"
          cp -R "Assignment-1-JS-Calculato" "Assignment-2-Todo-List" "Assignment-3-Form-Validation" "Assignment 6/dist/"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Assignment 6/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
